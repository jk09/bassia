# The weave release bundled into the Bassia packages (its weave-driver, the structural merge driver Bassia uses by
# default). Get-Weave.ps1 downloads the asset of a target from weave's GitHub release and refuses it unless its SHA-256
# matches the one pinned here. To move to another weave release, update the version and every checksum from that
# release's checksums.txt (https://github.com/Ataraxy-Labs/weave/releases), then check that the licenses under
# third-party/weave still match.
