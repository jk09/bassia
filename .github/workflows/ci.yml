# Tests Bassia and builds the installable packages (packaging/README.md): one per platform, each holding the CLI, weave's
# weave-driver and the installers, for a machine that already has the .NET runtime and git. Every package is installed
# and exercised on its own platform before it is uploaded as an artifact; a pushed v<semver> tag also publishes them as
# a GitHub release.
name: CI

on:
  push:
    branches: [main, main-client-server]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # The SDK channel, downloaded from builds.dotnet.microsoft.com directly: the aka.ms redirect that actions/setup-dotnet
  # and the dotnet-install scripts try first (dotnetorigin.blob.core.windows.net) answered 409 for 10.0.403 and failed
  # every job before the build.
  DOTNET_CHANNEL: '10.0'
  DOTNET_FEED: 'https://builds.dotnet.microsoft.com/dotnet'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The cloud backends' contract and server tests run against PostgreSQL and Azurite (Azure Blob Storage's emulator).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BASSIA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=postgres
      BASSIA_TEST_AZURE_BLOB: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
    steps:
      - uses: actions/checkout@v5

      - name: Install the .NET SDK
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version=$(curl -fsSL --retry 3 "$DOTNET_FEED/Sdk/$DOTNET_CHANNEL/latest.version" | tr -d '\r' | sed '/^$/d' | tail -n 1)
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) rid=linux-x64 ;; Linux/ARM64) rid=linux-arm64 ;; macOS/X64) rid=osx-x64 ;; macOS/ARM64) rid=osx-arm64 ;;
            *) echo "No .NET SDK for $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.dotnet"
          curl -fsSL --retry 3 "$DOTNET_FEED/Sdk/$version/dotnet-sdk-$version-$rid.tar.gz" | tar -xz -C "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      - name: Put the pinned weave-driver on PATH
        shell: pwsh
        run: |
          ./packaging/Get-Weave.ps1 -Rid linux-x64 -Destination "$env:RUNNER_TEMP/weave"
          "$env:RUNNER_TEMP/weave" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Start Azurite
        run: |
          mkdir -p "$RUNNER_TEMP/azurite"
          nohup npx --yes azurite@3.37.0 --silent --blobHost 127.0.0.1 --blobPort 10000 --location "$RUNNER_TEMP/azurite" \
            --skipApiVersionCheck --loose > "$RUNNER_TEMP/azurite.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null "http://127.0.0.1:10000/devstoreaccount1?comp=list" && break
            sleep 1
          done
          curl -s -o /dev/null -w "Azurite answers %{http_code}\n" "http://127.0.0.1:10000/devstoreaccount1?comp=list"

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

  devdrive:
    name: Dev Drive (Windows)
    # Block cloning of workspace files on a real ReFS volume: a VHD formatted as a Dev Drive (plain ReFS where this
    # Windows cannot format a Dev Drive), whose folder the DevDrive tests get in BASSIA_TEST_DEVDRIVE_DIR.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the .NET SDK (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Invoke-RestMethod "$env:DOTNET_FEED/Sdk/$env:DOTNET_CHANNEL/latest.version" -MaximumRetryCount 3) -split "`n" |
            ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -Last 1)
          $zip = Join-Path $env:RUNNER_TEMP 'dotnet-sdk.zip'
          Invoke-WebRequest "$env:DOTNET_FEED/Sdk/$version/dotnet-sdk-$version-win-x64.zip" -OutFile $zip -MaximumRetryCount 3
          $dir = Join-Path $env:USERPROFILE '.dotnet'
          Expand-Archive $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'dotnet.exe') --version
          "DOTNET_ROOT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Create a Dev Drive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'devdrive.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'devdrive.txt'
          @("create vdisk file=`"$vhd`" maximum=51200 type=expandable", "select vdisk file=`"$vhd`"", 'attach vdisk',
            'create partition primary', 'assign letter=R') | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed ($LASTEXITCODE)" }
          try {
            Format-Volume -DriveLetter R -DevDrive -NewFileSystemLabel BassiaDev -Confirm:$false -Force | Out-Null
            Write-Host 'Formatted R: as a Dev Drive.'
          }
          catch {
            Write-Host "No Dev Drive here ($($_.Exception.Message)); formatting R: as ReFS."
            Format-Volume -DriveLetter R -FileSystem ReFS -NewFileSystemLabel BassiaDev -Confirm:$false -Force | Out-Null
          }
          fsutil fsinfo volumeinfo R:
          fsutil devdrv query R:
          New-Item -ItemType Directory -Path 'R:\bassia-tests' | Out-Null
          'BASSIA_TEST_DEVDRIVE_DIR=R:\bassia-tests' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        run: dotnet build --configuration Release

      - name: Test block cloning
        run: dotnet test --configuration Release --no-build --filter "FullyQualifiedName~DevDrive|FullyQualifiedName~CloneCache" --logger "console;verbosity=normal"

  local-cloud:
    name: Local cloud (${{ matrix.mode }}, ${{ matrix.os }})
    # scripts/bassia-local-cloud.ps1, behind the /bassia-local-cloud skill: Azurite and PostgreSQL in Docker (Linux) or as
    # local processes (Windows, whose runner has PostgreSQL and Node.js installed), the cloud tests against them, and
    # the end-to-end smoke test (a server on both, two clones, git import, a landing, git export).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: docker
          - os: windows-2025
            mode: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the .NET SDK
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version=$(curl -fsSL --retry 3 "$DOTNET_FEED/Sdk/$DOTNET_CHANNEL/latest.version" | tr -d '\r' | sed '/^$/d' | tail -n 1)
          mkdir -p "$HOME/.dotnet"
          curl -fsSL --retry 3 "$DOTNET_FEED/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz" | tar -xz -C "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Install the .NET SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Invoke-RestMethod "$env:DOTNET_FEED/Sdk/$env:DOTNET_CHANNEL/latest.version" -MaximumRetryCount 3) -split "`n" |
            ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -Last 1)
          $zip = Join-Path $env:RUNNER_TEMP 'dotnet-sdk.zip'
          Invoke-WebRequest "$env:DOTNET_FEED/Sdk/$version/dotnet-sdk-$version-win-x64.zip" -OutFile $zip -MaximumRetryCount 3
          $dir = Join-Path $env:USERPROFILE '.dotnet'
          Expand-Archive $zip -DestinationPath $dir -Force
          "DOTNET_ROOT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Check
        shell: pwsh
        run: ./scripts/bassia-local-cloud.ps1 check

      - name: Up
        timeout-minutes: 12
        shell: pwsh
        run: |
          ./scripts/bassia-local-cloud.ps1 up -Mode ${{ matrix.mode }}
          ./scripts/bassia-local-cloud.ps1 up
          ./scripts/bassia-local-cloud.ps1 status

      - name: Smoke test
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/bassia-local-cloud.ps1 smoke

      - name: Cloud tests
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/bassia-local-cloud.ps1 test -Filter cloud

      - name: Server and import
        timeout-minutes: 12
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'tools'
          git init -q -b main $repo
          foreach ($i in 1..3) {
            Set-Content -Path (Join-Path $repo "f$i.txt") -Value "v$i"
            git -C $repo add -A
            git -C $repo -c user.name=ci -c user.email=ci@example.com commit -q -m "c$i"
          }
          ./scripts/bassia-local-cloud.ps1 serve
          ./scripts/bassia-local-cloud.ps1 serve
          ./scripts/bassia-local-cloud.ps1 import -Git $repo -History -NoBuild -Clone (Join-Path $env:RUNNER_TEMP 'monorepo')
          ./scripts/bassia-local-cloud.ps1 server-status
          ./scripts/bassia-local-cloud.ps1 server-stop
          ./scripts/bassia-local-cloud.ps1 import -Git $repo -Prefix tools2 -NoBuild
          ./scripts/bassia-local-cloud.ps1 server-reset
          ./scripts/bassia-local-cloud.ps1 server-status
          if ($LASTEXITCODE -ne 1) { throw 'server-status should report the stopped server (exit 1) after server-reset' }
          $global:LASTEXITCODE = 0

      - name: Down
        if: always()
        shell: pwsh
        run: ./scripts/bassia-local-cloud.ps1 down -Purge

  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-15-intel
          - rid: win-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the .NET SDK
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version=$(curl -fsSL --retry 3 "$DOTNET_FEED/Sdk/$DOTNET_CHANNEL/latest.version" | tr -d '\r' | sed '/^$/d' | tail -n 1)
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) rid=linux-x64 ;; Linux/ARM64) rid=linux-arm64 ;; macOS/X64) rid=osx-x64 ;; macOS/ARM64) rid=osx-arm64 ;;
            *) echo "No .NET SDK for $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.dotnet"
          curl -fsSL --retry 3 "$DOTNET_FEED/Sdk/$version/dotnet-sdk-$version-$rid.tar.gz" | tar -xz -C "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      - name: Install the .NET SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Invoke-RestMethod "$env:DOTNET_FEED/Sdk/$env:DOTNET_CHANNEL/latest.version" -MaximumRetryCount 3) -split "`n" |
            ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -Last 1)
          $zip = Join-Path $env:RUNNER_TEMP 'dotnet-sdk.zip'
          Invoke-WebRequest "$env:DOTNET_FEED/Sdk/$version/dotnet-sdk-$version-win-x64.zip" -OutFile $zip -MaximumRetryCount 3
          $dir = Join-Path $env:USERPROFILE '.dotnet'
          Expand-Archive $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'dotnet.exe') --version
          "DOTNET_ROOT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Ensure PowerShell 7
        if: runner.os != 'Windows'
        run: |
          if ! command -v pwsh >/dev/null; then
            dotnet tool install --global PowerShell
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Build the package
        shell: pwsh
        env:
          # A tag builds as the release (v1.2.0); anything else as <branch>-<short commit>.
          PACKAGE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.head_ref || github.ref_name }}
        run: ./packaging/New-BassiaPackage.ps1 -Rid ${{ matrix.rid }} -Ref $env:PACKAGE_REF -OutputDirectory dist

      - name: Install and check the package
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | Select-Object -First 1
          ./packaging/Test-BassiaPackage.ps1 -Archive $archive.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: bassia-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [test, devdrive, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # One line per package, whatever line ending (or none) each .sha256 file has.
          for f in *.sha256; do tr -d '\r\n' < "$f"; echo; done > SHA256SUMS
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Bassia $TAG" --generate-notes $prerelease \
            *.tar.gz *.zip SHA256SUMS
